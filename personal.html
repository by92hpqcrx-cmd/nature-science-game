<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自然科學王｜免登入個人挑戰</title>
<link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./cloud.css">
</head><body>
<header class="topbar"><div class="brand"><span class="brandicon">🧬</span><div><strong>自然科學王｜個人挑戰</strong><small>開啟直接答題・免帳號・免班級代碼</small></div></div>
<nav class="topactions"><a href="./index.html">四人搶答</a><a href="./teacher.html">老師管理</a></nav></header>
<main class="cloudmain">
<p id="message" role="status" aria-live="polite"></p>
<section class="panel cloudpanel hidden" id="joinPanel"><h1>班級記錄模式</h1><p>需要將個人成績儲存給老師查看時，才需要填寫班級代碼與姓名。</p>
<form id="joinForm"><label>班級代碼<input id="joinCode" maxlength="16" required autocomplete="off" placeholder="老師提供的代碼"></label><label>學生姓名<input id="studentName" maxlength="30" required autocomplete="name"></label>
<button id="joinSubmit" class="primary" type="submit">加入班級</button></form>
<p><button id="backGuestBtn" class="secondary" type="button">不填資料，直接開始訪客練習</button></p></section>
<section id="setupPanel" class="panel cloudpanel hidden"><h2 id="welcome">訪客練習設定</h2><div class="cloudgrid"><label>單元<select id="unitFilter"><option value="all">全部單元</option><option value="01">動物世界</option><option value="02">探索聲光世界</option></select></label>
<label>題數<select id="count"><option value="5">5 題</option><option value="10" selected>10 題</option><option value="20">20 題</option></select></label></div>
<p id="poolStatus"></p><button id="playBtn" class="primary">開始挑戰</button><button id="switchClass" class="secondary">使用班級記錄模式</button></section>
<section id="questionPanel" class="panel cloudpanel hidden"><div class="cloudrow"><b id="progress"></b><b id="score"></b></div><p id="topic" class="mutedinfo"></p>
<h2 id="questionText" class="bigquestion"></h2><div id="options" class="cloudoptions"></div><p id="feedback" role="status" aria-live="polite"></p><button id="nextBtn" class="primary hidden">下一題</button>
<div class="guest-footer"><span>訪客練習預設 10 題，成績僅顯示於本次畫面。</span><button id="classModeBtn" class="secondary" type="button">切換班級記錄模式</button></div></section>
<section id="endPanel" class="panel cloudpanel hidden"><h1>🏆 挑戰完成！</h1><h2 id="result"></h2><p id="saveStatus" role="status"></p><button class="primary" id="again">再玩一次（免輸入）</button><button class="secondary" id="guestBtn">開始新的訪客挑戰</button></section>
</main><script src="./supabase-config.js?v=20261108-2"></script><script src="./questions.js?v=20261108-2"></script><script src="./personal.js?v=20261108-2" type="module"></script></body></html>
