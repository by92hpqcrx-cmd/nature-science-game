<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自然科學王｜個人試卷</title><style>body{font:18px system-ui;background:#edf5e7;color:#24493b;margin:0}main{max-width:850px;margin:auto;padding:20px}section{background:white;border-radius:16px;padding:20px;margin:12px 0}button,input{font:inherit;padding:12px;border:1px solid #a9c7ac;border-radius:9px}button{background:#dcefd8;cursor:pointer}label{display:block;margin:12px 0}input[type=radio]{width:22px;height:22px}fieldset{border:1px solid #ccdcca;border-radius:12px;margin:12px 0;padding:15px}legend{font-weight:bold}#examHeader{position:sticky;top:0;background:#24493b;color:white;padding:10px 16px;z-index:2;border-radius:0 0 14px 14px;box-shadow:0 3px 10px #0002}#identity{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,24px);padding:4px 0;white-space:nowrap}#classLabel,#studentIdentity{font-size:clamp(18px,4.5vw,38px);font-weight:900;line-height:1.3;color:#fff5b8}#studentIdentity{display:inline}#status{margin:5px 0 0;font-size:16px} [hidden]{display:none!important}</style></head><body><main><h1>📝 個人試卷測驗</h1><header id="examHeader"><div id="identity" hidden><div id="classLabel"></div><strong id="studentIdentity"></strong></div><p id="status">連線中…</p></header><section id="join"><form id="joinForm"><label>座號 <input id="no" type="number" min="1" max="99" required></label><p>請輸入自己的座號，加入後核對姓名。</p><button id="joinBtn" disabled>加入測驗</button></form></section><section id="paper" hidden><h2 id="title"></h2><div id="questions"></div><button id="submit">確認交卷</button></section></main><script src="./supabase-config.js"></script><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=id=>document.getElementById(id),room=new URL(location.href).searchParams.get('room')||'',cfg=window.NATURE_SUPABASE||{};
if(!/^[a-f0-9]{32}$/.test(room)||!cfg.url||!cfg.anonKey){$('status').textContent='無效的測驗網址';throw Error('invalid room')}
const key='king-exam-'+room;let state;try{state=JSON.parse(sessionStorage.getItem(key))}catch{}state||={client:crypto.randomUUID().replaceAll('-',''),answers:[]};const save=()=>{try{sessionStorage.setItem(key,JSON.stringify(state))}catch{}};
const sb=createClient(cfg.url,cfg.anonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}),ch=sb.channel('nature-exam-'+room,{config:{broadcast:{self:false}}});const send=(type,extra={})=>ch.send({type:'broadcast',event:'student',payload:{type,client:state.client,...extra}});
let questions=[],submitted=false,closed=false;
function done(message){submitted=true;$('paper').hidden=true;$('join').hidden=true;$('status').textContent=message}
function draw(p){if(submitted||closed||!Array.isArray(p.questions))return;if(questions.length)return;questions=p.questions;$('title').textContent=p.title||'個人試卷';$('join').hidden=true;$('paper').hidden=false;const box=$('questions');box.replaceChildren();questions.forEach((q,i)=>{const f=document.createElement('fieldset'),l=document.createElement('legend');l.textContent=(i+1)+'. '+q.text;f.append(l);q.options.forEach((v,j)=>{const label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='q'+i;input.checked=state.answers[i]===j;input.onchange=()=>{state.answers[i]=j;save();progress()};label.append(input,document.createTextNode(' '+v));f.append(label)});box.append(f)});progress()}
function progress(){$('status').textContent='已答 '+questions.filter((q,i)=>Number.isInteger(state.answers[i])).length+'／'+questions.length+' 題'}
ch.on('broadcast',{event:'teacher'},({payload:p})=>{if(!p||p.to&&p.to!==state.client)return;if(p.type==='open'&&state.no)send('sync');if(p.type==='closed'){closed=true;if(!submitted){$('paper').hidden=true;$('join').hidden=true;$('status').textContent='老師已停止收卷，未交卷請找老師'}}if(p.type==='error'){$('status').textContent=p.message;$('submit').disabled=false}if(['admitted','state'].includes(p.type)&&Number.isInteger(p.no)&&typeof p.name==='string'){$('identity').hidden=false;$('classLabel').textContent=p.classLabel||'';$('studentIdentity').textContent=p.no+' 號　'+p.name;}if(p.type==='received'||p.submitted){done('✅ 已交卷，等待老師儲存成績');return}if(['admitted','state'].includes(p.type)){if(p.phase==='running')draw(p);else if(p.phase==='lobby'){$('join').hidden=true;$('status').textContent='已加入，等待老師開放試卷'}else if(p.phase==='closed'||p.phase==='saved'){$('status').textContent='測驗已結束'}}});
ch.subscribe(status=>{if(status==='SUBSCRIBED'){$('joinBtn').disabled=false;$('status').textContent='請輸入自己的座號';if(state.no)send('join',{no:state.no})}else $('status').textContent='連線：'+status});
$('joinForm').onsubmit=e=>{e.preventDefault();state.no=Number($('no').value);delete state.pin;save();send('join',{no:state.no})};
$('submit').onclick=()=>{if(submitted||closed)return;const answers=questions.map((q,i)=>Number.isInteger(state.answers[i])?state.answers[i]:null);if(!confirm('確定交卷？未答 '+answers.filter(x=>x===null).length+' 題，交卷後不能修改。'))return;$('submit').disabled=true;send('submit',{answers});setTimeout(()=>{if(!submitted&&!closed){$('submit').disabled=false;$('status').textContent='尚未收到交卷確認，請重新交卷'}},5000)};
setInterval(()=>{if(state.no&&!submitted&&!closed)send('sync')},4000);
</script></body></html>
