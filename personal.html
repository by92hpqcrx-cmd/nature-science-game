<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自然科學王｜個人挑戰</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="cloud.css"></head><body><header class="topbar"><div class="brand"><span class="brandicon">🧬</span><div><strong>自然科學王｜個人挑戰</strong><small>線上學習與成績儲存</small></div></div><nav class="topactions"><a href="index.html">四人搶答</a><a href="teacher.html">老師管理</a></nav></header><main class="cloudmain"><p id="message" role="status"></p><section class="panel cloudpanel" id="joinPanel"><h1>加入班級，開始挑戰！</h1><p>輸入老師提供的班級代碼與姓名。第一次使用會建立匿名學習身分（需老師在 Supabase 開啟匿名登入）。</p><form id="joinForm"><label>班級代碼<input id="joinCode" maxlength="16" required autocomplete="off" placeholder="例：A13B4C55"></label><label>學生姓名<input id="studentName" maxlength="30" required></label><button class="primary">加入班級</button></form></section><section id="setupPanel" class="panel cloudpanel hidden"><h2 id="welcome"></h2><div class="cloudgrid"><label>單元<select id="unitFilter"><option value="all">全部單元</option><option value="01">動物世界</option><option value="02">探索聲光世界</option></select></label><label>題數<select id="count"><option value="5">5 題</option><option value="10" selected>10 題</option><option value="20">20 題</option></select></label></div><p id="poolStatus"></p><button id="playBtn" class="primary">開始個人挑戰</button><button id="switchClass" class="secondary">更換班級</button></section><section id="questionPanel" class="panel cloudpanel hidden"><div class="cloudrow"><b id="progress"></b><b id="score"></b></div><p id="topic" class="mutedinfo"></p><h2 id="questionText" class="bigquestion"></h2><div id="options" class="cloudoptions"></div><p id="feedback" role="status"></p><button id="nextBtn" class="primary hidden">下一題</button></section><section id="endPanel" class="panel cloudpanel hidden"><h1>🏆 挑戰完成！</h1><h2 id="result"></h2><p id="saveStatus"></p><button class="primary" id="again">再玩一次</button></section></main><script src="supabase-config.js"></script><script src="questions.js"></script><script type="module" src="personal.js"></script></body></html>
