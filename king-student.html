<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>自然科學王｜學生平板競賽</title><link rel="stylesheet" href="./king.css?v=20261121-2"><link rel="stylesheet" href="./king-tablet.css?v=20261121-3"></head><body><main class="shell"><header class="brand"><span class="brandIcon">📱</span><div><strong>自然科學王｜學生平板</strong><small>掃碼加入・同時作答・即時得分</small></div></header>
<section id="join" class="chalkboard"><h1>🎒 加入競賽</h1><p id="joinStatus" class="subtitle">正在連接教室…</p><form id="joinForm"><label>請輸入你的座號<input id="seatNumber" type="number" required min="1" max="99" inputmode="numeric" placeholder="例如：12"></label><button class="start" type="submit" id="joinButton" disabled>📱 加入老師的競賽</button></form><p class="subnote">請使用自己的座號，一位學生只能使用一個座號。</p><button type="button" id="studentQuit" class="small quitAction">✕ 中斷退出</button></section>
<section id="waiting" class="chalkboard hidden"><h1>✅ 已加入教室</h1><h2 id="studentName"></h2><p id="waitMessage" class="subtitle">等待老師開始競賽…</p><p id="myCurrentScore" class="subtitle">目前 0 分</p><button type="button" class="small quitAction" id="waitQuit">✕ 退出競賽</button></section>
<section id="playing" class="chalkboard hidden"><div class="gameTop"><b id="mySeat"></b><b id="studentProgress"></b><b id="studentRemaining"></b></div><p id="studentScore" class="subtitle">目前 0 分</p><h2 id="studentQuestion"></h2><div id="studentOptions" class="options"></div><button type="button" id="endAnswer" class="small passAction">⏹ 結束答題（本題不計分）</button><p id="studentFeedback" class="feedback" aria-live="polite"></p><div class="studentTop"><b>🏆 即時前三名</b><div id="studentTop3">尚無得分</div></div><button type="button" id="playQuit" class="small quitAction">✕ 退出競賽</button></section>
<section id="done" class="chalkboard hidden"><h1>🎉 競賽已結束</h1><p id="doneMessage" class="subtitle"></p><p class="subnote">最終成績由老師的 FunDesk 結算。</p><button type="button" id="doneQuit" class="small">關閉連線</button></section>
</main><script src="./supabase-config.js"></script><script type="module" src="./king-student.js?v=20261121-3"></script></body></html>
