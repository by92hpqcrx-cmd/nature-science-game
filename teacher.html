<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自然科學王｜老師管理</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="cloud.css"></head><body><header class="topbar"><div class="brand"><span class="brandicon">🧑‍🏫</span><div><strong>自然科學王｜老師後台</strong><small>題庫・班級・成績</small></div></div><nav class="topactions"><a href="index.html">四人搶答</a><a href="personal.html">個人版</a></nav></header><main class="cloudmain"><p id="message" role="status"></p><section class="panel cloudpanel" id="loginPanel"><h1>老師登入</h1><p>使用先前 Supabase 的同一組老師帳號。</p><form id="loginForm"><label>電子郵件<input type="email" id="email" required></label><label>密碼<input type="password" id="password" required></label><button class="primary">登入</button></form></section><section id="managePanel" class="hidden"><div class="cloudrow"><h1>老師管理中心</h1><button id="logoutBtn" class="secondary">登出</button></div><section class="panel cloudpanel"><h2>🏫 班級管理</h2><form id="classForm" class="inlineform"><label>新班級名稱<input id="className" maxlength="80" placeholder="例如 五年一班" required></label><button class="primary">新增班級</button></form><div id="classList"></div></section><section class="panel cloudpanel"><h2>📚 線上題庫管理</h2><p>可新增、修改、停用或刪除雲端題目。原本的離線題庫不受影響。</p><form id="questionForm"><input id="editId" type="hidden"><div class="cloudgrid"><label>單元<select id="unit" required></select></label><label>難度<select id="difficulty"><option>易</option><option selected>中</option><option>難</option></select></label><label>知識點<input id="topic" placeholder="如：光的折射"></label></div><label>題目<textarea id="question" required rows="2"></textarea></label><div class="cloudgrid"><label>選項 1<input id="opt0" required></label><label>選項 2<input id="opt1" required></label><label>選項 3<input id="opt2" required></label><label>選項 4<input id="opt3" required></label></div><label>正確選項<select id="answer"><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option></select></label><label>解析<textarea id="explanation" rows="2"></textarea></label><label class="inlinecheck"><input id="active" type="checkbox" checked> 啟用題目</label><div class="cloudrow"><button type="submit" class="primary">儲存題目</button><button type="button" id="clearQuestion" class="secondary">清除表單</button></div></form><h3>已建立的雲端題目</h3><div id="questionList"></div></section><section class="panel cloudpanel"><h2>📊 學生與競賽成績</h2><label>班級<select id="reportClass"></select></label><div class="cloudrow"><button id="refreshReport" class="secondary">重新整理</button><button id="downloadReport" class="secondary">下載成績 CSV</button></div><div id="memberList"></div><div id="reportList"></div></section></section></main><script src="supabase-config.js"></script><script type="module" src="teacher.js"></script></body></html>
